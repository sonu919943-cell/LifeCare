version: '3.8'
services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: kaamorax-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: kaamorax
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: kaamorax-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
